# Book Store Microservices Architecture
services:
  # Infrastructure Services
  config-server:
    container_name: ms_config_server
    build:
      context: ./services/config-server
      dockerfile: Dockerfile
    ports:
      - "18888:8888"  # Config Server (external:internal)
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=/config-repo
    volumes:
      - ./services/config-server/src/main/resources/configurations:/config-repo
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - microservices-net
    restart: unless-stopped

  discovery-service:
    container_name: ms_discovery_service
    build:
      context: ./services/discovery
      dockerfile: Dockerfile
    ports:
      - "18761:8761"  # Eureka Server (external:internal)
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://ms_config_server:18888
    networks:
      - microservices-net
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  gateway:
    container_name: ms_gateway_service
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "18080:8080"  # API Gateway (external:internal)
    networks:
      - microservices-net
    depends_on:
      - discovery-service
    restart: unless-stopped

  # Business Services
  user-manager:
    container_name: ms_user_manager
    build:
      context: ./services/UserManager
      dockerfile: Dockerfile
    ports:
      - "9090:9090"  # User Manager Service
    environment:
      - SPRING_APPLICATION_NAME=User Manager Service
      - SPRING_CLOUD_CONFIG_URI=http://ms_config_server:18888
      - SPRING_CLOUD_CONFIG_FAIL_FAST=true
      - SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL=2000
      - SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS=30
      - SPRING_CLOUD_CONFIG_RETRY_MAX_INTERVAL=5000
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_CONFIG_IMPORT=optional:configserver:http://ms_config_server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ms_user_manager_db:5432/usermanager?currentSchema=bookstore
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=kafka:9092
      - SPRING_KAFKA_PRODUCER_KEY-SERIALIZER=org.apache.kafka.common.serialization.StringSerializer
      - SPRING_KAFKA_PRODUCER_VALUE-SERIALIZER=org.springframework.kafka.support.serializer.JsonSerializer
      - SPRING_KAFKA_CONSUMER_GROUP-ID=user-manager-group
      - SPRING_KAFKA_CONSUMER_AUTO-OFFSET-RESET=earliest
      - SPRING_KAFKA_CONSUMER_KEY-DESERIALIZER=org.apache.kafka.common.serialization.StringDeserializer
      - SPRING_KAFKA_CONSUMER_VALUE-DESERIALIZER=org.springframework.kafka.support.serializer.JsonDeserializer
    networks:
      - microservices-net
    depends_on:
      config-server:
        condition: service_healthy
      ms_user_manager_db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  book-stock-manager:
    container_name: ms_book_stock_manager
    build:
      context: ./services/BookStockManager
      dockerfile: Dockerfile
    ports:
      - "19092:9092"  # Book Stock Manager Service (external:internal)
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://ms_config_server:18888
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=kafka:9092
      - MAVEN_OPTS=-Dmaven.wagon.http.pool=false

    networks:
      - microservices-net
    depends_on:
      - ms_book_stock_manager_db
      - discovery-service
      - config-server
    restart: unless-stopped

  notification-manager:
    container_name: ms_notification_manager
    build:
      context: ./services/NotificationManager
      dockerfile: Dockerfile
    ports:
      - "19091:9091"  # Notification Manager Service
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://ms_config_server:18888
      - SPRING_MAIL_HOST=mail-dev
      - SPRING_MAIL_PORT=1025
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=kafka:9092
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - MAVEN_OPTS=-Dmaven.wagon.http.pool=false

    networks:
      - microservices-net
    depends_on:
      - ms_notification_manager_db
      - mail-dev
      - kafka
      - discovery-service
      - config-server
    restart: unless-stopped
  
  #############################################
  # Databases and Storage
  #############################################
  # User Manager Database
  ms_user_manager_db:
    container_name: ms_user_manager_db
    image: postgres:17.2
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=usermanager
      - POSTGRES_SCHEMA=bookstore
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - user_manager_db:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "6343:5432"  # User Manager DB (selon la configuration standard)
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usermanager && psql -U postgres -d usermanager -c 'SELECT 1 FROM pg_database' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: [
      "postgres",
      "-c", "max_connections=100",
      "-c", "shared_buffers=256MB",
      "-c", "effective_cache_size=768MB",
      "-c", "maintenance_work_mem=64MB",
      "-c", "checkpoint_completion_target=0.9",
      "-c", "wal_buffers=7864kB",
      "-c", "default_statistics_target=100",
      "-c", "random_page_cost=1.1",
      "-c", "effective_io_concurrency=200"
    ]
    restart: unless-stopped

  # Book Stock Manager Database
  ms_book_stock_manager_db:
    container_name: ms_book_stock_manager_db
    image: postgres:17.2
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - book_stock_manager_db:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "6344:5432"  # Book Stock Manager DB
    networks:
      - microservices-net
    restart: unless-stopped

  # Notification Manager Database
  ms_notification_manager_db:
    container_name: ms_notification_manager_db
    image: postgres:17.2
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - notification_manager_db:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "6345:5432"  # Notification Manager DB
    networks:
      - microservices-net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8.14.0
    # image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin.pgadmin@localhost.ms
      - PGADMIN_DEFAULT_PASSWORD=ms_pgadmin_password
      - PGADMIN_CONFIG_SERVER_MODE=False
      - GUNICORN_CMD_ARGS=--timeout 120
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "15080:80"
    container_name: ms_pgadmin
    networks:
      - microservices-net
    restart: unless-stopped

  mongodb:
    container_name: ms_mongodb
    # image: mongo:5.0.31-rc0-nanoserver-ltsc2022
    image: mongo
    volumes:
      - mongo:/data
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=pass
    ports:
      - "27018:27017"
    networks:
      - microservices-net
    restart: unless-stopped

  mongo-express:
    container_name: ms_mongo_express
    image: mongo-express:1.0.2-20-alpine3.19
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=false
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=pass
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=tribes
    ports:
      - "18081:8081"
    networks:
      - microservices-net
    restart: unless-stopped

  #############################################
  # Message Brokers and Event Processing
  #############################################
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    container_name: ms_zookeeper
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"
    networks:
      - microservices-net
    healthcheck:
      test: echo stat | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: ms_kafka
    ports:
      - "9092:9092"  # Port Kafka standard
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - microservices-net
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  #############################################
  # Development Tools and Services
  #############################################
  mail-dev:
    container_name: ms_mail_dev
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
      - "2525:1025"  # SMTP port
    restart: unless-stopped

  #############################################
  # Monitoring and Observability
  #############################################
  prometheus:
    image: prom/prometheus:latest
    container_name: ms_prometheus
    ports:
      - "8090:9090"
    volumes:
      - ./services/NotificationManager/config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./services/NotificationManager/config/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml
      - ./monitoring/data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - microservices-net

  grafana:
    image: grafana/grafana:latest
    container_name: ms_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/data/grafana:/var/lib/grafana
      - ./services/NotificationManager/config/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/notification-dashboard.json
    depends_on:
      - prometheus
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  user_manager_db:
  book_stock_manager_db:
  notification_manager_db:
  pgadmin:
  mongo: