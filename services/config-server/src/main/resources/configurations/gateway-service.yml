server:
  port: 8080  # API Gateway

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

# Routes configuration
      routes:
        - id: user-service
          uri: http://localhost:9090
          predicates:
            - Path=/api/v1/users/**
        - id: book-stock-service
          uri: http://localhost:9092
          predicates:
            - Path=/api/v1/books/**
        - id: notification-service
          uri: http://localhost:9091
          predicates:
            - Path=/api/v1/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always