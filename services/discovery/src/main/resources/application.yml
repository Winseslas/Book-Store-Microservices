spring:
  application:
    name: discovery-service
  config:
    import: optional:configserver:http://ms_config_server:8888

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}/${server.port}/eureka/

server:
  port: 8761